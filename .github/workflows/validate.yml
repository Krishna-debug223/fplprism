name: Validate FPL Prism

on:
  push:
    branches:
      - main
      - feature/fpl-risk-v12-product-model
    paths-ignore:
      - ".modelbook-state/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Existing model invariants
        run: npm run model:check

      - name: Model v1.2 invariants
        run: npm run model:check:v12

      - name: Modelbook archive calculations
        run: npm run modelbook:check

      - name: Free Hit squad optimization and scoring
        run: npm run squad:check

      - name: Full walk-forward backtest
        env:
          BACKTEST_SEASON: 2025-26
          BACKTEST_START_GW: 4
          BACKTEST_END_GW: 38
        run: npm run backtest

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-reports
          path: reports/backtest-*.json
          if-no-files-found: error

      - name: Production build
        run: npm run build
