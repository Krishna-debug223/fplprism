name: Refresh fixture forecasts and archive Modelbook

on:
  schedule:
    # Avoid the top-of-hour surge that can delay scheduled workflows.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Optional Gameweek to process; deadline and fixture locks keep their normal pre-match timing"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: modelbook-snapshots
  cancel-in-progress: false

jobs:
  refresh-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh pre-kickoff forecasts and archive completed weeks
        env:
          FPL_PRISM_SITE_URL: https://fplprism.com
          MODELBOOK_GAMEWEEK: ${{ inputs.gameweek }}
        run: node scripts/modelbook-automation.mjs

      - name: Refresh independent benchmark diagnostics
        run: node scripts/benchmark-modelbook.mjs

      - name: Publish fixture checkpoints and immutable Modelbook files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/modelbook/data lib/modelbook.ts
          if [ -d .modelbook-state ]; then git add -A -- .modelbook-state; fi
          if git diff --cached --quiet; then
            echo "No Modelbook changes to publish."
            exit 0
          fi
          git commit -m "Refresh fixture forecasts and archive Modelbook data"
          git push origin HEAD:main
